<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pacientes - Medicenter</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h2>Medicenter</h2>
</header>

<div class="container">
    <h1>Pacientes</h1>

    <a class="botao" th:href="@{/pacientes/novo}">Novo paciente</a>

    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Nascimento</th>
            <th>Telefone</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="paciente : ${pacientes}">
            <td th:text="${paciente.nome}"></td>
            <td th:text="${paciente.cpf}"></td>
            <td th:text="${#temporals.format(paciente.dataNascimento, 'dd/MM/yyyy')}"></td>
            <td th:text="${paciente.telefone}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(pacientes)}">
            <td colspan="4">Nenhum paciente cadastrado</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
