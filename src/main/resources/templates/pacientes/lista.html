<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pacientes - Medicenter</title>
</head>
<body>

<h1>Pacientes</h1>

<table border="1">
    <thead>
    <tr>
        <th>Nome</th>
        <th>CPF</th>
        <th>Nascimento</th>
        <th>Telefone</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="paciente : ${pacientes}">
        <td th:text="${paciente.nome}"></td>
        <td th:text="${paciente.cpf}"></td>
        <td th:text="${paciente.dataNascimento}"></td>
        <td th:text="${paciente.telefone}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(pacientes)}">
        <td colspan="4">Nenhum paciente cadastrado</td>
    </tr>
    </tbody>
</table>

</body>
</html>
