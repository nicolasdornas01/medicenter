<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Paciente - Medicenter</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h2>Medicenter</h2>
</header>

<div class="container">
    <h1>Cadastro de Paciente</h1>

    <form th:action="@{/pacientes/salvar}" th:object="${paciente}" method="post">

        <input type="hidden" th:field="*{id}">

        <p>
            <label>Nome</label>
            <input type="text" th:field="*{nome}" required>
        </p>

        <p>
            <label>CPF</label>
            <input type="text" th:field="*{cpf}" required>
        </p>

        <p>
            <label>Data de nascimento</label>
            <input type="date" th:field="*{dataNascimento}">
        </p>

        <p>
            <label>Telefone</label>
            <input type="text" th:field="*{telefone}">
        </p>

        <button class="botao" type="submit">Salvar</button>
        <a class="botao botao-voltar" th:href="@{/pacientes}">Voltar</a>

    </form>
</div>

</body>
</html>
